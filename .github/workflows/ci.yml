name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Run tests
        run: python -m pytest -q

  retrieval-eval:
    name: Retrieval eval (harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-models-${{ runner.os }}-
      - name: Check for an indexable corpus
        id: corpus
        run: |
          # data/ always contains junk (.index db, admin.db) so "any file"
          # is not a corpus. Only real documents count - and the harness has
          # the same guard, so this skip is just a noisier form of it.
          if find data -type f \
            ! -name '*.db' ! -name '*.sqlite3' \
            ! -path 'data/.index/*' ! -path 'data/.docling_vet/*' \
            -print -quit 2>/dev/null | grep -q .; then
            echo "has_corpus=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_corpus=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build index and run retrieval eval
        if: steps.corpus.outputs.has_corpus == 'true'
        run: >-
          python -m chatbot.evaluate
          --set evals/eval_set.json
          --k 3
          --json eval-report.json
      - name: Upload eval report
        if: always() && steps.corpus.outputs.has_corpus == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report.json