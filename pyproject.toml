[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-chatbot"
version = "0.1.0"
description = "ESG document RAG chatbot with persistent vector retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "python-multipart",
    "sentence-transformers",
    "transformers",
    "scikit-learn",
    "numpy",
    "sqlite-vec",
    "httpx",
    "fastapi",
    "uvicorn",
    "prometheus-client",
]

[project.optional-dependencies]
dev = ["pytest"]
# Multi-format ingestion (PDF, Office, HTML, AsciiDoc, images, ...).
ingest = ["docling==2.129.0"]
# Adds audio/video transcription (Whisper). Also needs the ffmpeg binary.
ingest-asr = ["docling[asr]==2.129.0"]

[project.scripts]
esg-chatbot = "chatbot.cli:main"
view-index = "chatbot.view_index:main"
esg-api = "chatbot.api:run"
esg-eval = "chatbot.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]