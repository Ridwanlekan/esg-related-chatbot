[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-chatbot"
version = "0.1.0"
description = "ESG document RAG chatbot with persistent vector retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "python-multipart",
    "sentence-transformers",
    "transformers",
    "scikit-learn",
    "numpy",
    "sqlite-vec",
    "httpx",
    "fastapi",
    "uvicorn",
    "prometheus-client",
]

[project.optional-dependencies]
dev = ["pytest"]
# Multi-format ingestion (PDF, Office, HTML, AsciiDoc, images, ...).
ingest = ["docling==2.129.0"]
# Adds audio/video transcription (Whisper). Also needs the ffmpeg binary.
ingest-asr = ["docling[asr]==2.129.0"]
# Voice mode: on-device STT and TTS. Cloud STT/TTS need nothing extra, since
# they reuse the openai client already required by the base install.
# faster-whisper pulls in PyAV, which bundles the ffmpeg libraries, so no ffmpeg
# binary or system package is needed.
# av<19 is load-bearing: faster-whisper's audio.decode_audio() calls
# av.open(..., metadata_errors="ignore"), and PyAV 19 dropped that keyword, so
# an unpinned PyAV fails at transcribe time with "open() got an unexpected
# keyword argument 'metadata_errors'". Drop the ceiling once faster-whisper
# ships a fix.
# kokoro-onnx (not the reference `kokoro` package) because that one requires
# Python <3.13 and we pin 3.13. It also needs no torch. espeak-ng arrives as a
# wheel via espeakng-loader, so there is no system package to install.
voice = ["faster-whisper>=1.0.0", "av<19", "kokoro-onnx>=0.6.0", "soundfile>=0.13"]

[project.scripts]
esg-chatbot = "chatbot.cli:main"
view-index = "chatbot.view_index:main"
esg-api = "chatbot.api:run"
esg-eval = "chatbot.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]